<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPI Taxi Icons</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #f2f2f4;
        color: #111111;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 650;
      }

      p {
        margin: 0 0 24px;
        color: #5c5f66;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
        gap: 16px;
      }

      .card {
        display: grid;
        gap: 12px;
        place-items: center;
        padding: 18px 14px 14px;
        border: 1px solid #dddddf;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 10px 24px rgba(22, 24, 29, 0.06);
      }

      .frame {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 16px;
        background: #fbfbfc;
      }

      img {
        width: 36px;
        height: 36px;
      }

      .label {
        font-size: 12px;
        text-align: center;
        color: #53565c;
      }
    </style>
  </head>
  <body>
    <h1>RPI Taxi Icons</h1>
    <p>Clean vector SVG recreations. Black glyphs, transparent backgrounds.</p>
    <section class="grid">
      <article class="card">
        <div class="frame"><img src="./01-target-pin.svg" alt="Target pin icon" /></div>
        <div class="label">01 target pin</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./02-arrow-down.svg" alt="Down arrow icon" /></div>
        <div class="label">02 arrow down</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./03-map-pin.svg" alt="Map pin icon" /></div>
        <div class="label">03 map pin</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./04-walk.svg" alt="Walk icon" /></div>
        <div class="label">04 walk</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./05-chevron-left.svg" alt="Chevron left icon" /></div>
        <div class="label">05 chevron left</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./06-menu.svg" alt="Menu icon" /></div>
        <div class="label">06 menu</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./07-scope.svg" alt="Scope icon" /></div>
        <div class="label">07 scope</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./08-search.svg" alt="Search icon" /></div>
        <div class="label">08 search</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./09-home.svg" alt="Home icon" /></div>
        <div class="label">09 home</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./10-briefcase.svg" alt="Briefcase icon" /></div>
        <div class="label">10 briefcase</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./11-history.svg" alt="History icon" /></div>
        <div class="label">11 history</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./12-arrow-up-left.svg" alt="Arrow up left icon" /></div>
        <div class="label">12 arrow up left</div>
      </article>
      <article class="card">
        <div class="frame"><img src="./13-route.svg" alt="Route icon" /></div>
        <div class="label">13 route</div>
      </article>
    </section>
  </body>
</html>
